format=dcai-recorded-connector-contract-v1
contract.id=recorded-source-system-contract-v1
contract.version=2026-06-mvp
contract.scope=local-recorded-source-system-simulation
contract.externalConnector=false
contract.productionDataAllowed=false
contract.endpointExposure=none

required.manifest=format,batch.id,sourceSystem.id,sourceSystem.label,importedAt,connectorContract.id,connectorContract.version
required.files=facilities.csv,zones.csv,assets.csv,incidents.csv,dependencies.csv,workflow_events.csv,work_orders.csv,validation_results.csv,telemetry_impacts.csv
optional.files=scenario_inventory.csv

facilities.csv.keys=facilityId
zones.csv.keys=zoneId,facilityId
assets.csv.keys=assetId,zoneId,assetType,criticalityLevel,operationalStatus,hallId,rowId,rackId,capacityGroupId,assetClass
incidents.csv.keys=incidentId,assetId,currentStageId,currentStageLabel
dependencies.csv.keys=edgeId,dependentAssetId,dependencyAssetId,dependencyRole,impactScope,pathId,pathClass
workflow_events.csv.keys=eventId,incidentId,enteredStageId,enteredStageLabel,status,enteredAt,exitedAt,durationHours,delayHours
work_orders.csv.keys=workOrderId,incidentId,workOrderStatus,assignedTeam,timestamp,confidenceState
validation_results.csv.keys=validationId,incidentId,validationStatus,timestamp,confidenceState
telemetry_impacts.csv.keys=impactId,evidenceId,incidentId,timestamp,estimatedCapacityRiskKw,affectedGpuCount,affectedRackCount,redundancyState,mitigationState,vendorState,vendorEtaAt,metricName,metricValue,metricUnit,telemetryStatus,confidenceState
scenario_inventory.csv.keys=scenarioId,incidentId,scenarioType,operationalNarrative,expectedReasoningFocus,primarySourceSystems,replayWindowStart,replayWindowEnd

quarantine.invalidRows=true
quarantine.duplicateNaturalKeys=true
determinism.stableIds=true
determinism.stableTimestamps=true
determinism.stablePayloadHashes=true
promotion.requiresShacl=true
promotion.requiresProvenance=true
